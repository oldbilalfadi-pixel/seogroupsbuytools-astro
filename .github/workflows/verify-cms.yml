name: Verify all Pages CMS content editing
on:
  push:
    branches: [main]
    paths:
      - '.pages.yml'
      - 'scripts/verify-cms.mjs'
      - 'src/lib/render.js'
      - 'src/pages/[...slug].astro'
      - 'content/**'
      - '.github/workflows/verify-cms.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify unchanged HTML on all 72 pages and test every CMS field family
        run: node scripts/verify-cms.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build all Astro pages
        run: npm run build
      - name: Check published page count
        run: |
          test "$(find dist -name index.html | wc -l)" -ge 65
