name: Browser visual parity audit
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Capture desktop and mobile screenshots, JS errors and page geometry
        run: node scripts/visual-parity.cjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-parity-screenshots
          path: audit-results/
