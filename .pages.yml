media:
  - name: uploads
    label: Images
    input: public/assets/images
    output: /assets/images
    categories: [image]
settings:
  content:
    merge: true
content:
  - name: homepage
    label: Homepage
    type: file
    path: content/homepage.json
    format: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: description, label: Page description, type: text }
      - { name: seoTitle, label: SEO title, type: string }
      - { name: seoDescription, label: SEO description, type: text }
      - name: hero
        label: Hero content
        type: object
        fields:
          - { name: headingBefore, label: Heading start, type: string }
          - { name: headingHighlight, label: Highlighted heading, type: string }
          - { name: headingAfter, label: Heading ending, type: string }
          - { name: description, label: Description, type: text }
      - name: editorContent
        label: Website text
        type: object
        list: true
        fields:
          - { name: text, label: Text, type: text }
      - name: links
        label: Buttons and links
        type: object
        list: true
        fields:
          - { name: text, label: Button or link text, type: string }
          - { name: url, label: Destination URL, type: string }
      - name: images
        label: Images
        type: object
        list: true
        fields:
          - { name: src, label: Image URL, type: image, options: { media: uploads } }
          - { name: alt, label: Image description, type: string }
  - name: products
    label: Products
    type: collection
    path: content/products
    format: json
    filename: "{slug}.json"
    view: { primary: title, fields: [title, route] }
    operations: { rename: false, delete: false }
    fields: &page_fields
      - name: editorContent
        label: Website text
        type: object
        list: true
        fields:
          - { name: text, label: Text, type: text }
      - { name: title, label: Product title, type: string }
      - { name: description, label: Product description, type: text }
      - { name: seoTitle, label: SEO title, type: string }
      - { name: seoDescription, label: SEO description, type: text }
  - name: pages
    label: Pages and guides
    type: collection
    path: content/pages
    format: json
    filename: "{slug}.json"
    view: { primary: title, fields: [title, route] }
    operations: { rename: false, delete: false }
    fields: *page_fields
  - name: settings
    label: Site settings
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: siteUrl, label: Production URL, type: string }
      - { name: siteName, label: Site name, type: string }
      - { name: previewNoindex, label: Preview noindex, type: boolean }
