name: Verify Pages CMS 72 pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Pages CMS configuration YAML
        run: |
          ruby -e 'require "yaml"; c=YAML.load_file(".pages.yml", aliases: true); abort "Missing CMS collections" unless c.fetch("content").length == 4; abort "Merge protection disabled" unless c.dig("settings", "content", "merge") == true; puts "Pages CMS configuration syntax valid"'
      - name: Validate CMS content and editable fields
        run: node scripts/verify-cms.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static website
        run: npm run build
