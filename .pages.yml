media:
  input: public/assets/images
  output: /assets/images

settings:
  content:
    merge: true

content:
  - name: homepage
    label: Homepage
    type: file
    path: content/homepage.json
    format: json
    fields:
      - name: hero
        label: Homepage hero
        type: object
        fields:
          - {name: headingBefore, label: Heading start, type: string}
          - {name: headingHighlight, label: Highlighted words, type: string}
          - {name: headingAfter, label: Heading ending, type: string}
          - {name: description, label: Hero description, type: text}
      - {name: title, label: SEO title, type: string}
      - {name: description, label: SEO description, type: text}
      - {name: route, label: URL path, type: string, readonly: true}
      - {name: html, label: Legacy HTML source, type: code, readonly: true, options: {format: html}}
      - {name: sourceFile, label: Source file, type: string, readonly: true}

  - name: products
    label: Products
    type: collection
    path: content/products
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, route]
      primary: title
      search: [title, route]
    fields: &page_fields
      - {name: title, label: SEO title, type: string}
      - {name: description, label: SEO description, type: text}
      - {name: route, label: URL path, type: string, readonly: true}
      - {name: html, label: Legacy HTML source, type: code, readonly: true, options: {format: html}}
      - {name: sourceFile, label: Source file, type: string, readonly: true}

  - name: pages
    label: Pages and guides
    type: collection
    path: content/pages
    format: json
    filename: "{primary}.json"
    view:
      fields: [title, route]
      primary: title
      search: [title, route]
    fields: *page_fields

  - name: settings
    label: Site settings
    type: file
    path: content/settings.json
    format: json
    fields:
      - {name: siteUrl, label: Production URL, type: string}
      - {name: siteName, label: Site name, type: string}
      - {name: previewNoindex, label: Preview noindex, type: boolean}
