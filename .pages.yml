media:
  - name: uploads
    label: Images
    input: public/assets/images
    output: /assets/images
    categories: [image]
settings:
  content:
    merge: true
content:
  - name: homepage
    label: Homepage
    type: file
    path: content/homepage.json
    format: json
    fields: &fields
      - { name: slug, label: File slug, type: string, readonly: true }
      - { name: route, label: Page URL, type: string, readonly: true }
      - { name: seoTitle, label: SEO title, type: string }
      - { name: seoDescription, label: SEO description, type: text }
      - name: hero
        label: Homepage hero
        type: object
        fields:
          - { name: headingBefore, label: Heading start, type: string }
          - { name: headingHighlight, label: Highlighted words, type: string }
          - { name: headingAfter, label: Heading end, type: string }
          - { name: description, label: Hero description, type: text }
      - name: sections
        label: Editable content sections
        type: object
        list: true
        fields:
          - { name: key, label: Section ID, type: string, readonly: true }
          - { name: label, label: Section name, type: string, readonly: true }
          - { name: content, label: Edit content, type: rich-text, options: { format: html, media: uploads, switcher: true } }
          - { name: original, label: Original content, type: text, readonly: true }
          - { name: source, label: Original HTML tag, type: text, readonly: true }
      - { name: title, label: Original title, type: string, readonly: true }
      - { name: description, label: Original description, type: text, readonly: true }
      - { name: sourceFile, label: Original source file, type: string, readonly: true }
  - name: products
    label: Products
    type: collection
    path: content/products
    format: json
    filename: "{slug}.json"
    view: { primary: seoTitle, fields: [seoTitle, route] }
    operations: { rename: false, delete: false }
    fields: *fields
  - name: pages
    label: Pages and guides
    type: collection
    path: content/pages
    format: json
    filename: "{slug}.json"
    view: { primary: seoTitle, fields: [seoTitle, route] }
    operations: { rename: false, delete: false }
    fields: *fields
  - name: settings
    label: Site settings
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: siteUrl, label: Production URL, type: string }
      - { name: siteName, label: Site name, type: string }
      - { name: previewNoindex, label: Preview noindex, type: boolean }
